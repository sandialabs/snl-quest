name: Publish to TestPyPI

on:
  push:
    branches:
      - main
      - master
    paths:
      - version.txt

jobs:
  publish:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: release

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build source and wheel distributions
        run: |
          python - <<'PY'
          import pathlib
          import sys

          repo_root = pathlib.Path.cwd().resolve()
          sys.path = [path for path in sys.path if path not in ("", str(repo_root))]

          import build

          output_dir = repo_root / "dist"
          output_dir.mkdir(exist_ok=True)
          builder = build.ProjectBuilder(str(repo_root))

          for distribution in ("sdist", "wheel"):
              builder.build(distribution, str(output_dir))
          PY

      - name: Validate built distributions
        run: python -m twine check dist/*

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
