name: GitHub Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - version.txt
  

permissions:
  contents: write

env:
  RELEASE_NOTES_FILE: .github/release-notes.md
  MACOS_INSTALL_FILE: .github/scripts/install.sh
  WINDOWS_INSTALL_FILE: .github/scripts/install.bat
  PKG_NAME: snl-questfy26

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      pkg_name: ${{ steps.meta.outputs.pkg_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read version metadata
        id: meta
        run: |
          version="$(tr -d '\r\n' < version.txt)"
          echo "tag_name=$version" >> "$GITHUB_OUTPUT"
          echo "pkg_name=${{ env.PKG_NAME }}" >> "$GITHUB_OUTPUT"
          echo "release_name=QuESt $version" >> "$GITHUB_OUTPUT"
          if echo "$version" | grep -Eq '[A-Za-z]'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-source:
    name: Build source archives
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install source build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build ZIP and TAR.GZ source distributions
        run: python setup.py sdist --formats=zip,gztar

      - name: Extract source archive
        run: unzip dist/*.zip -d package
      - name: Debug extracted directory
        run: ls package/

      - name: Check if build went successful
        run: echo "Build was successful"

  build-macos:
    name: Build macOS Package
    needs: [prepare-release, build-source]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build source distribution
        run: python setup.py sdist --formats=zip

      - name: Extract source archive
        run: unzip dist/*.zip -d package

      - name: Copy macOS installer
        run: |
          dir=$(ls package/)
          cp ${{ env.MACOS_INSTALL_FILE }} package/$dir/install.sh
          chmod +x package/$dir/install.sh

      - name: Repackage macOS ZIP
        run: |
          cd package
          dir=$(ls .)
          zip -r ../dist/${{ needs.prepare-release.outputs.pkg_name }}-${{ needs.prepare-release.outputs.tag_name }}-macos.zip $dir

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*-macos.zip
    
  build-windows:
    name: Build Windows Package
    needs: [prepare-release, build-source]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build source distribution
        run: python setup.py sdist --formats=zip

      - name: Extract source archive
        shell: pwsh
        run: |
          Expand-Archive dist/*.zip package

      - name: Copy Windows installer
        shell: pwsh
        run: |
          $dir = Get-ChildItem package | Select-Object -First 1 -ExpandProperty Name
          Copy-Item ${{ env.WINDOWS_INSTALL_FILE }} package/$dir/install.bat

      - name: Repackage Windows ZIP
        shell: pwsh
        run: |
          $dir = Get-ChildItem package | Select-Object -First 1 -ExpandProperty Name
          Compress-Archive `
            package/$dir `
            dist/${{ needs.prepare-release.outputs.pkg_name }}-${{ needs.prepare-release.outputs.tag_name }}-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-windows.zip


  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-source
      - build-windows   
      - build-macos     
    environment:
      name: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/windows/*
            release-assets/macos/*
