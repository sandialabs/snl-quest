name: GitHub Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - version.txt
  

permissions:
  contents: write

env:
  RELEASE_NOTES_FILE: .github/release-notes.md

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version metadata
        id: meta
        run: |
          version="$(tr -d '\r\n' < version.txt)"
          echo "tag_name=$version" >> "$GITHUB_OUTPUT"
          echo "release_name=QuESt $version" >> "$GITHUB_OUTPUT"
          if echo "$version" | grep -Eq '[A-Za-z]'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-source:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install source build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build source distribution
        run: python setup.py sdist

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-source
    environment:
      name: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: source-dist
          path: release-assets/source

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/source/*
