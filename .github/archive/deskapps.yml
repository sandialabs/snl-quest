name: GitHub Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - version.txt
  

permissions:
  contents: write

env:
  RELEASE_NOTES_FILE: .github/release-notes.md
  WINDOWS_STARTUP_FILE: ""
  MACOS_STARTUP_FILE: ""

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version metadata
        id: meta
        run: |
          version="$(tr -d '\r\n' < version.txt)"
          echo "tag_name=$version" >> "$GITHUB_OUTPUT"
          echo "release_name=QuESt $version" >> "$GITHUB_OUTPUT"
          if echo "$version" | grep -Eq '[A-Za-z]'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-source:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install source build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build source distribution
        run: python setup.py sdist

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-dist
          path: dist/*

  build-desktop:
    name: Build desktop distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel cx_Freeze
          python -m pip install .

      - name: Install macOS system libraries
        if: runner.os == 'macOS'
        run: |
          brew install libiodbc
          prefix="$(brew --prefix libiodbc)"
          sudo mkdir -p /usr/local/opt/libiodbc/lib
          sudo ln -sf "$prefix/lib/libiodbc.2.dylib" /usr/local/opt/libiodbc/lib/libiodbc.2.dylib

      - name: Remove optional Qt SQL drivers
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          from pathlib import Path
          import PySide6

          plugin_dir = Path(PySide6.__file__).resolve().parent / "Qt" / "plugins" / "sqldrivers"
          for pattern in ("*qsqlodbc*", "*qsqlpsql*"):
              for path in plugin_dir.glob(pattern):
                  print(f"Removing optional Qt SQL driver: {path}")
                  path.unlink()
          PY

      - name: Build desktop application
        run: python setup_cx.py build

      - name: Add Windows startup file
        if: runner.os == 'Windows' && env.WINDOWS_STARTUP_FILE != ''
        shell: pwsh
        run: |
          Copy-Item "${{ env.WINDOWS_STARTUP_FILE }}" -Destination build\

      - name: Add macOS startup file
        if: runner.os == 'macOS' && env.MACOS_STARTUP_FILE != ''
        run: |
          cp "${{ env.MACOS_STARTUP_FILE }}" build/
          chmod +x "build/$(basename "${{ env.MACOS_STARTUP_FILE }}")"

      - name: Archive Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build\\* -DestinationPath quest-windows.zip

      - name: Archive macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build quest-macos.zip

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            quest-windows.zip
            quest-macos.zip

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-source
      - build-desktop
    environment:
      name: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: source-dist
          path: release-assets/source

      - name: Download Windows desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-latest
          path: release-assets/windows

      - name: Download macOS desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-latest
          path: release-assets/macos

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/source/*
            release-assets/windows/*
            release-assets/macos/*